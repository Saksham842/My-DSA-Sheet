<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NextLeet - DSA & System Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="system_design.css"/>
</head>
<body>

<!-- GLOBAL APPLICATION NAVBAR -->
<header class="app-navbar" style="border-bottom: 1px solid #1a202c; background: rgba(8, 10, 15, 0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; padding: 10px 24px;">
  <div style="max-width: 1500px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
    <!-- NextLeet Brand Logo -->
    <div class="brand-logo-wrap" style="display: flex; align-items: center; gap: 10px; cursor: pointer;" id="navBrandLogo">
      <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; font-family: 'Inter', sans-serif;">
        <span style="color: rgb(4, 112, 202)">N</span><span style="color: rgb(47, 195, 106)">e</span><span style="color: rgb(249, 129, 47)">x</span><span style="color: rgb(230, 64, 92)">t</span><span style="color: rgb(218, 0, 171)">L</span><span style="color: rgb(183, 0, 218)">e</span><span style="color: rgb(232, 98, 63)">e</span><span style="color: rgb(107, 10, 255)">t</span>
      </div>
      <span style="font-size: 11px; font-weight: 600; color: #94a3b8; background: #131722; padding: 3px 8px; border-radius: 6px; border: 1px solid #22293a;">DSA &amp; System Design</span>
    </div>

    <!-- Navigation Tabs -->
    <div class="header-tabs" style="display: flex; gap: 8px;">
      <button class="daily-tab active" id="tabAllSheets">All Sheets</button>
      <button class="daily-tab" id="tabSystemDesign" style="display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>
        <span>System Design</span>
      </button>
      <button class="daily-tab" id="tabRevision">Revision</button>
      <button class="daily-tab add-btn" id="btnAddProblem" style="border: 1px dashed var(--border-color); cursor: pointer;">+ Add Problem</button>
    </div>

    <!-- Data Actions -->
    <div class="data-actions" style="display: flex; align-items: center; gap: 8px;">
      <button id="btnExportData" class="daily-tab" style="padding: 4px 12px; font-size: 12px; height: auto;">Export Data</button>
      <button id="btnImportData" class="daily-tab" style="padding: 4px 12px; font-size: 12px; height: auto;">Import Data</button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;">
    </div>
  </div>
</header>

<!-- PAGE 1: COMPANIES LIST -->
<main id="homePage" class="main-container">
  <div style="display: flex; align-items: center; justify-content: flex-end; margin-bottom: 24px;">
    <div class="search-container home-search" style="margin-bottom: 0; width: 360px;">
      <input type="text" id="companySearchInput" class="search-input" placeholder="Search any question..." autocomplete="off">
    </div>
  </div>

  <!-- Practice Dashboard -->
  <section class="daily-progress-dashboard" style="margin-bottom: 40px;">
    <div class="progress-circle-container">
      <svg class="progress-circle" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="40" />
        <circle class="fill" id="daily-progress-circle" cx="50" cy="50" r="40" />
      </svg>
      <div class="progress-text">
        <span id="daily-percentage">0%</span>
      </div>
    </div>
    <div class="progress-info">
      <h2>Overall Practice Progress</h2>
      <div class="progress-stats">
        <span id="daily-fraction">0 / 0</span>
      </div>
    </div>
    <div class="difficulty-stats" style="margin-left: auto; display: flex; gap: 24px;">
      <div class="stat"><span class="dot easy"></span> Easy: <span id="daily-easy-count">0</span></div>
      <div class="stat"><span class="dot medium"></span> Medium: <span id="daily-medium-count">0</span></div>
      <div class="stat"><span class="dot hard"></span> Hard: <span id="daily-hard-count">0</span></div>
    </div>
  </section>

  <div class="companies-grid" id="companiesGrid">
    <!-- Company cards injected here -->
  </div>

  <!-- Global Question Search Results -->
  <div id="globalSearchResults" class="questions-list" style="display: none; margin-top: 24px;">
    <!-- Search results injected here -->
  </div>
</main>

<!-- PAGE 2: COMPANY SHEET -->
<main id="sheetPage" class="main-container" style="display: none;">
  <!-- Company Header Card -->
  <div class="company-header-card">
    <div class="header-top">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        All Sheets
      </button>
      <div class="header-actions">
        <button class="icon-btn"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>
        <button class="icon-btn"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></button>
      </div>
    </div>

    <div class="company-info-row">
      <div class="c-logo-large" id="sheetCompanyLogo">Ap</div>
      <div class="c-details">
        <h2 id="sheetCompanyName">Apple</h2>
        <p id="sheetCompanyProblems">171 Problems</p>
      </div>
    </div>

    <div class="sheet-progress-bar">
      <div class="progress-info">
        <span>Progress</span>
        <span id="progressStats">0/171 (0.0%)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>
  </div>

  <div class="reset-wrapper">
    <button class="reset-btn" id="resetBtn">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      Reset
    </button>
  </div>

  <div class="filters-panel">
    <div class="filters-left">
      <select id="sortSelect" class="dropdown sort-select">
        <option value="frequency">Sort by: Frequency</option>
        <option value="difficulty">Sort by: Difficulty</option>
        <option value="id">Sort by: Question Number</option>
      </select>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="questionSearchInput" class="search-input" placeholder="Search questions..." autocomplete="off">
  </div>

  <div class="questions-list" id="questionsList">
    <!-- Questions will be injected here -->
  </div>
</main>

<!-- PAGE 3: NEXTLEET SYSTEM DESIGN CLONE -->
<main id="systemDesignPage" style="display: none;">
  <!-- Reading Progress Bar -->
  <div id="sdReadingProgressBar"></div>

  <!-- Sidebar -->
  <aside class="sd-sidebar" id="sdSidebar">
    <div class="sd-sidebar-header">
      <div class="sd-sidebar-title-row">
        <div class="sd-sidebar-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>
          <span>System Design</span>
        </div>
        <span class="sd-overall-badge" id="sdOverallBadge">0/407 (0%)</span>
      </div>
      <div class="sd-sidebar-search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="sdSearchInput" class="sd-sidebar-search-input" placeholder="Search 28 chapters &amp; topics..." autocomplete="off">
      </div>
    </div>
    <div class="sd-chapters-list" id="sdChaptersList">
      <!-- 28 chapters dynamically rendered by sd_app.js -->
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="sd-main-area" id="sdMainArea">
    <!-- Top Control Bar -->
    <div class="sd-top-control-bar">
      <div class="sd-top-left-controls">
        <button class="sd-sidebar-toggle-btn" id="sdSidebarToggle" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path></svg>
        </button>
        <nav class="sd-breadcrumbs" id="sdBreadcrumbs" aria-label="Breadcrumb">
          <!-- Breadcrumb links -->
        </nav>
      </div>
    </div>

    <!-- Chapter Content Container -->
    <div class="sd-content-container" id="sdContentContainer">
      <!-- Section cards rendered here -->
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div class="sd-lightbox-modal" id="sdLightboxModal">
    <div class="sd-lightbox-content">
      <button class="sd-lightbox-close" id="sdLightboxClose" title="Close (Esc)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <img id="sdLightboxImg" class="sd-lightbox-img" src="" alt="Architecture Diagram">
    </div>
  </div>
</main>

<!-- Add Problem Modal -->
<div id="add-problem-modal" class="modal">
  <div class="modal-content">
    <h3>Add Custom Problem</h3>
    <div class="form-group">
      <label>Problem Number (Optional)</label>
      <input type="text" id="custom-problem-number" placeholder="E.g. 101">
    </div>
    <div class="form-group">
      <label>Problem Name</label>
      <input type="text" id="custom-problem-name" placeholder="E.g. Two Sum">
    </div>
    <div class="form-group">
      <label>Direct Link (Optional)</label>
      <input type="text" id="custom-problem-link" placeholder="https://leetcode.com/problems/...">
    </div>
    <div class="form-group">
      <label>Add to Section</label>
      <select id="custom-problem-step" class="modal-select">
        <option value="none">Practice</option>
      </select>
    </div>
    <div class="form-group">
      <label>Difficulty</label>
      <div class="difficulty-options">
        <button class="diff-opt easy selected" data-diff="Easy">Easy</button>
        <button class="diff-opt medium" data-diff="Medium">Medium</button>
        <button class="diff-opt hard" data-diff="Hard">Hard</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelModal">Cancel</button>
      <button class="btn-save" id="btnSaveProblem">Add to List</button>
    </div>
  </div>
</div>

<button class="feature-request-btn">
  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  Feature Request
</button>

<script src="data.js"></script>
<script src="sd_data.js"></script>
<script src="sd_app.js"></script>
<script src="app.js"></script>
</body>
</html>
